name: Release SHX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' && (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release-1.0.0]'))
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          RELEASE_VERSION="${{ inputs.version || (github.ref_type == 'tag' && github.ref_name || '') }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if [[ -z "$RELEASE_VERSION" ]]; then
            LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
            LATEST_TAG="${LATEST_TAG#v}"
            if [[ "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS=. read -r major minor patch <<< "$LATEST_TAG"
              RELEASE_VERSION="$major.$minor.$((patch + 1))"
            else
              RELEASE_VERSION="1.0.1"
            fi
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Publishing SHX $RELEASE_VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_VERSION}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :SHXReleaseLabel ${RELEASE_VERSION}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${RELEASE_VERSION//./}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile SHX-${RELEASE_VERSION}.icns" Packaging/Info.plist

      - name: Build app icon
        run: ./Scripts/build-icon.sh

      - name: Build release disk image
        run: |
          cp Package.swift "$RUNNER_TEMP/SHX.Package.swift"
          trap 'cp "$RUNNER_TEMP/SHX.Package.swift" Package.swift' EXIT
          cp Package.release.swift Package.swift
          rm -f Package.resolved
          swift --version
          ./Scripts/package-release.sh
          file .build/SHX.app/Contents/MacOS/SHX
          lipo -info .build/SHX.app/Contents/MacOS/SHX | grep -q arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" \
              ".build/releases/SHX-${RELEASE_VERSION}.dmg" \
              --clobber
          else
            gh release create "v${RELEASE_VERSION}" \
              ".build/releases/SHX-${RELEASE_VERSION}.dmg" \
              --title "SHX ${RELEASE_VERSION}" \
              --generate-notes
          fi
