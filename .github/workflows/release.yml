name: Release KiteShell

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' && (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release-1.0.0]'))
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name || '1.0.0') }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${RELEASE_VERSION}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :KiteShellReleaseLabel ${RELEASE_VERSION}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${RELEASE_VERSION//./}" Packaging/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile KiteShell-${RELEASE_VERSION}.icns" Packaging/Info.plist

      - name: Build release disk image
        run: |
          swift --version
          ./Scripts/package-release.sh
          file .build/KiteShell.app/Contents/MacOS/KiteShell
          lipo -info .build/KiteShell.app/Contents/MacOS/KiteShell | grep -q arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name || '1.0.0') }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" \
              ".build/releases/KiteShell-${RELEASE_VERSION}.dmg" \
              --clobber
          else
            gh release create "v${RELEASE_VERSION}" \
              ".build/releases/KiteShell-${RELEASE_VERSION}.dmg" \
              --title "KiteShell ${RELEASE_VERSION}" \
              --generate-notes
          fi
